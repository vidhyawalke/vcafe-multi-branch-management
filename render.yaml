services:
  # VCafe Full Stack Web Service (Render)
  - type: web
    name: vcafe-management-system
    env: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build:client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vcafe-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database on Render
  - name: vcafe-postgres
    plan: free
    region: singapore
    databaseName: vcafe_db
    user: vcafe_admin
